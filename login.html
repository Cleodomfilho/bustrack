<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BusTrack Escolar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="background: rgba(56, 189, 248, 0.2); width: 64px; height: 64px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(56, 189, 248, 0.4); margin-bottom: 1rem;">
                <i class="fas fa-bus text-primary" style="font-size: 1.5rem;"></i>
            </div>
            <h1 style="font-size: 1.5rem; font-weight: 700;">Bem-vindo de volta</h1>
            <p style="color: var(--muted-foreground); font-size: 0.875rem;">Escolha como deseja acessar a plataforma</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="padding: 1rem; border: 1px solid var(--border); border-radius: 0.75rem; background: rgba(255,255,255,0.02); cursor: pointer; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'" onclick="window.location.href='responsavel.html'">
                <div class="flex items-center gap-4">
                    <div style="background: rgba(56, 189, 248, 0.1); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                        <i class="fas fa-users"></i>
                    </div>
                    <div>
                        <h3 style="font-size: 1rem; margin-bottom: 0.1rem;">Responsável</h3>
                        <p style="font-size: 0.75rem; color: var(--muted-foreground);">Acompanhar o ônibus do meu filho</p>
                    </div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; color: var(--muted-foreground); font-size: 0.75rem;"></i>
                </div>
            </div>

            <div style="padding: 1rem; border: 1px solid var(--border); border-radius: 0.75rem; background: rgba(255,255,255,0.02); cursor: pointer; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'" onclick="window.location.href='motorista.html'">
                <div class="flex items-center gap-4">
                    <div style="background: rgba(56, 189, 248, 0.1); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <div>
                        <h3 style="font-size: 1rem; margin-bottom: 0.1rem;">Motorista</h3>
                        <p style="font-size: 0.75rem; color: var(--muted-foreground);">Atualizar status da rota</p>
                    </div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; color: var(--muted-foreground); font-size: 0.75rem;"></i>
                </div>
            </div>
        </div>

        <div style="margin-top: 2rem; text-align: center;">
            <a href="index.html" class="btn-ghost" style="text-decoration: none; font-size: 0.875rem;">
                <i class="fas fa-arrow-left" style="margin-right: 0.5rem;"></i> Voltar ao início
            </a>
        </div>
    </div>
</body>
</html>
