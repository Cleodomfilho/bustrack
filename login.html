<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BusTrack Escolar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="background: rgba(56, 189, 248, 0.2); width: 64px; height: 64px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(56, 189, 248, 0.4); margin-bottom: 1rem;">
                <i class="fas fa-bus text-primary" style="font-size: 1.5rem;"></i>
            </div>
            <h1 style="font-size: 1.5rem; font-weight: 700;">Bem-vindo de volta</h1>
            <p style="color: var(--muted-foreground); font-size: 0.875rem;">Escolha como deseja acessar a plataforma</p>
        </div>

        <form id="login-form" style="display:flex; flex-direction:column; gap:1rem;">
            <div class="input-group">
                <label class="label">Usuário</label>
                <input id="username" type="text" placeholder="seu.usuario" required />
            </div>
            <div class="input-group">
                <label class="label">Senha</label>
                <input id="password" type="password" placeholder="********" required />
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Entrar</button>
                <button type="button" id="register-btn" class="btn btn-ghost" style="flex:1;">Registrar</button>
            </div>
        </form>

        <div style="margin-top: 2rem; text-align: center;">
            <a href="index.html" class="btn-ghost" style="text-decoration: none; font-size: 0.875rem;">
                <i class="fas fa-arrow-left" style="margin-right: 0.5rem;"></i> Voltar ao início
            </a>
        </div>
    </div>
    <script>
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) return alert('Preencha usuário e senha');

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) {
                    const err = await res.json();
                    return alert(err.erro || 'Falha ao autenticar');
                }
                const user = await res.json();
                localStorage.setItem('busUser', JSON.stringify(user));
                if (user.role === 'motorista') window.location.href = 'motorista.html';
                else window.location.href = 'responsavel.html';
            } catch (err) {
                console.error(err);
                alert('Erro ao conectar com o servidor');
            }
        });

        document.getElementById('register-btn').addEventListener('click', () => {
            const username = document.getElementById('username').value.trim();
            const nome = username || prompt('Nome (ex: João)');
            const role = prompt('Role: motorista ou responsavel', 'responsavel');
            const password = prompt('Senha');
            if (!nome || !role || !password) return alert('Registro cancelado');
            fetch('/api/users/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome, username, role, password }) })
                .then(r => r.json()).then(data => {
                    if (data.erro) return alert(data.erro);
                    alert('Usuário registrado. Faça login.');
                }).catch(() => alert('Erro ao registrar'));
        });
    </script>
</body>
</html>
