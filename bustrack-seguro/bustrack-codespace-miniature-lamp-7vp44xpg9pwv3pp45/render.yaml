services:
  - type: web
    name: bustrack-mongodb-atlas
    env: node
    plan: free
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        fromSecret: MONGO_URI
      # ZAP_API_KEY removed — mensagens agora são internas ao app
