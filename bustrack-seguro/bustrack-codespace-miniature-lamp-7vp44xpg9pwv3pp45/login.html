<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BusTrack Escolar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
  <div class="card" style="width: 100%; max-width: 420px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="background: rgba(56, 189, 248, 0.2); width: 64px; height: 64px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(56, 189, 248, 0.4); margin-bottom: 1rem;">
        <i class="fas fa-bus text-primary" style="font-size: 1.5rem;"></i>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 700;">Acesse o BusTrack</h1>
      <p style="color: var(--muted-foreground); font-size: 0.95rem;">Entre com seu e-mail e senha para ver o painel apropriado.</p>
    </div>

    <form id="login-form" style="display:flex; flex-direction:column; gap:1rem;">
      <div class="input-group">
        <label class="label">E-mail</label>
        <input id="email" type="email" placeholder="email@exemplo.com" required />
      </div>
      <div class="input-group">
        <label class="label">Senha</label>
        <input id="password" type="password" placeholder="********" required />
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
    </form>

    <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
      <a href="register.html" class="btn btn-outline" style="flex:1; text-align:center;">Criar conta</a>
      <a href="index.html" class="btn btn-ghost" style="flex:1; text-align:center;">Voltar</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return alert('Preencha e-mail e senha');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (!response.ok) {
          return alert(data.error || 'Falha ao autenticar');
        }

        saveSession(data.token, data.user);
        routeToRolePage();
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
</body>
</html>
