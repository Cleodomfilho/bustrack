<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - BusTrack Escolar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
  <div class="card" style="width: 100%; max-width: 440px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="background: rgba(56, 189, 248, 0.2); width: 64px; height: 64px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(56, 189, 248, 0.4); margin-bottom: 1rem;">
        <i class="fas fa-user-plus text-primary" style="font-size: 1.5rem;"></i>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 700;">Criar conta</h1>
      <p style="color: var(--muted-foreground); font-size: 0.95rem;">Cadastre-se como motorista, aluno ou responsável.</p>
    </div>

    <form id="register-form" style="display:flex; flex-direction:column; gap:1rem;">
      <div class="input-group">
        <label class="label">Nome completo</label>
        <input id="nome" type="text" placeholder="João da Silva" required />
      </div>
      <div class="input-group">
        <label class="label">E-mail</label>
        <input id="email" type="email" placeholder="email@exemplo.com" required />
      </div>
      <div class="input-group">
        <label class="label">Senha</label>
        <input id="password" type="password" placeholder="********" required />
      </div>
      <div class="input-group">
        <label class="label">Tipo de usuário</label>
        <select id="role" required>
          <option value="motorista">Motorista</option>
          <option value="responsavel">Responsável</option>
          <option value="aluno">Aluno</option>
        </select>
      </div>
      <div class="input-group" id="vehicle-join-group">
        <label class="label">Placa do veículo (aluno/responsável)</label>
        <input id="vehiclePlate" type="text" placeholder="ABC1D23" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Registrar</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; color: var(--muted-foreground); font-size: 0.9rem;">
      Já tem conta? <a href="login.html" style="color: var(--primary); text-decoration: none;">Entrar</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const roleInput = document.getElementById('role');
    const vehicleJoinGroup = document.getElementById('vehicle-join-group');

    roleInput.addEventListener('change', () => {
      const role = roleInput.value;
      if (role === 'aluno' || role === 'responsavel') {
        vehicleJoinGroup.style.display = 'block';
      } else {
        vehicleJoinGroup.style.display = 'none';
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = document.getElementById('role').value;
      const vehiclePlate = document.getElementById('vehiclePlate').value.trim();

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, password, role, vehiclePlate })
        });
        const data = await response.json();
        if (!response.ok) {
          return alert(data.error || 'Erro ao registrar');
        }

        saveSession(data.token, data.user);
        alert('Registrado com sucesso. Você será redirecionado.');
        routeToRolePage();
      } catch (error) {
        alert(error.message);
      }
    });

    vehicleJoinGroup.style.display = 'none';
  </script>
</body>
</html>
