services:
  - type: web
    name: bustrack
    env: node
    plan: free
    buildCommand: npm ci --omit=dev --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGO_DB_NAME
        value: bustrack
